<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신백현중학교 온라인 교무실</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #0f172a !important;
            color: #ffffff;
            min-height: 100vh;
        }

        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 20px 0;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.15), rgba(15, 23, 42, 0.8));
            z-index: 0;
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 30px;
            z-index: 1;
            padding: 0 15px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #60a5fa;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            word-break: keep-all;
        }

        header p {
            font-size: 0.88rem;
            color: #94a3b8;
            word-break: keep-all;
        }

        main {
            width: 100%;
            max-width: 600px;
            padding: 0 16px;
            z-index: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            justify-content: center;
        }

        .office-card {
            background-color: #1e293b;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 28px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .office-card:hover {
            transform: translateY(-4px);
            background-color: #334155;
            background: rgba(51, 65, 85, 0.8);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 15px 25px -8px rgba(59, 130, 246, 0.3);
        }

        .office-card:active {
            transform: scale(0.96);
            background-color: #334155;
        }

        .icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            word-break: keep-all;
            line-height: 1.3;
            color: #ffffff;
        }

        .c-calendar { color: #f87171; }
        .c-treasure { color: #facc15; }
        .c-classroom { color: #2dd4bf; }
        .c-ai { color: #a78bfa; }

        footer {
            margin-top: 40px;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            z-index: 1;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.5rem; }
            .grid-container { gap: 12px; }
            .office-card { padding: 22px 12px; border-radius: 16px; }
            .icon-box { width: 48px; height: 48px; font-size: 22px; }
            .card-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <h1>🏫 신백현중학교 온라인 교무실</h1>
        <p>원하시는 업무 메뉴를 선택하시면 바로 연결됩니다.</p>
    </header>

    <main>
        <div class="grid-container">
            <!-- 1. 오늘의 일정 (새 노션 주소 반영) -->
            <a href="https://plausible-clave-a20.notion.site/3d8930617c3f80399197cea8e06b1a7b?v=3d8930617c3f80c58b03000cd06654bf" target="_blank" class="office-card">
                <div class="icon-box c-calendar"><i class="fa-solid fa-calendar-days"></i></div>
                <span class="card-title">오늘의 일정<br>(노션 캘린더)</span>
            </a>

            <!-- 2. 보물창고 -->
            <a href="https://docs.google.com/spreadsheets/d/1Q6N_aM4Oy8IAHlOX8BEabyekh6Yho-xalQV8CbwfbkY/edit?gid=1872786866#gid=1872786866" target="_blank" class="office-card">
                <div class="icon-box c-treasure"><i class="fa-solid fa-box-archive"></i></div>
                <span class="card-title">보물창고</span>
            </a>

            <!-- 3. 구글 클래스룸 -->
            <a href="https://edu.google.com/intl/ALL_kr/workspace-for-education/products/classroom/" target="_blank" class="office-card">
                <div class="icon-box c-classroom"><i class="fa-solid fa-chalkboard-user"></i></div>
                <span class="card-title">구글 클래스룸</span>
            </a>

            <!-- 4. AI 교수 학습 (하이러닝) -->
            <a href="https://hi.goe.go.kr" target="_blank" class="office-card">
                <div class="icon-box c-ai"><i class="fa-solid fa-robot"></i></div>
                <span class="card-title">AI 교수 학습</span>
            </a>
        </div>
    </main>

    <footer>
        <p>© 2026 신백현중학교 온라인 교무실 System</p>
    </footer>

</body>
</html>
